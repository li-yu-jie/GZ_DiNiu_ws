<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>地牛叉车 Web 控制端</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ===================== 顶栏 ===================== -->
<header id="topbar">
  <span id="title">🤖 地牛叉车控制端</span>
  <span id="ros-status" class="dot dot-red" title="rosbridge 连接状态"></span>
  <div id="mode-group">
    <button id="btn-mode-nav" class="btn btn-mode">🧭 导航模式</button>
    <button id="btn-mode-map" class="btn btn-mode">🗺️ 建图模式</button>
    <button id="btn-mode-stop" class="btn btn-mode btn-danger">⏹ 停止</button>
    <span id="mode-label">未启动</span>
  </div>
  <button id="btn-save-map" class="btn btn-warn hidden">💾 保存地图</button>
  <button id="btn-panel-toggle" class="btn">☰</button>
</header>

<div id="main">
  <!-- ===================== 左侧工具栏 ===================== -->
  <div id="toolbar">
    <button class="tool active" data-tool="pan" title="平移/缩放">✋<span>平移</span></button>
    <button class="tool" data-tool="goal" title="设置导航目标">🎯<span>目标</span></button>
    <button class="tool" data-tool="initpose" title="设置初始位姿(重定位)">📍<span>定位</span></button>
    <button class="tool" data-tool="addwp" title="添加导航点">🚩<span>加点</span></button>
    <button class="tool" data-tool="editmap" title="修图：画墙/擦噪点">✏️<span>修图</span></button>
    <button class="tool" data-tool="keepout" title="禁区：绘制禁行区域">⛔<span>禁区</span></button>
    <button id="tool-teleop" class="tool" title="虚拟摇杆">🕹️<span>摇杆</span></button>
    <hr>
    <button id="zoom-in" class="tool" title="放大">＋</button>
    <button id="zoom-out" class="tool" title="缩小">－</button>
    <button id="zoom-fit" class="tool" title="适配全图">⛶</button>
    <button id="follow-robot" class="tool active" title="跟随小车">🚜</button>
  </div>

  <!-- ===================== 地图画布 ===================== -->
  <div id="map-container">
    <canvas id="map-canvas"></canvas>
    <!-- 修图/禁区工具条 -->
    <div id="editor-bar" class="hidden">
      <span id="editor-title">修图</span>
      <button class="btn editor-brush active" data-brush="wall">⬛ 墙</button>
      <button class="btn editor-brush" data-brush="free">⬜ 空地</button>
      <button class="btn editor-brush" data-brush="unknown" id="brush-unknown">🌫 未知</button>
      <label>笔刷 <input type="range" id="brush-size" min="1" max="60" value="8"></label>
      <button id="editor-save" class="btn btn-warn">💾 保存</button>
      <button id="editor-cancel" class="btn">✖ 放弃</button>
    </div>
    <!-- 摇杆 -->
    <div id="joystick-zone" class="hidden">
      <div id="joystick-base"><div id="joystick-knob"></div></div>
      <div id="joystick-hint">按住拖动遥控 · 松开即停</div>
    </div>
    <div id="toast" class="hidden"></div>
  </div>

  <!-- ===================== 右侧面板 ===================== -->
  <div id="panel">
    <div class="panel-section" id="sec-nav">
      <h3>🧭 导航</h3>
      <div id="nav-state">空闲</div>
      <div id="nav-feedback">剩余距离: -- m</div>
      <button id="btn-cancel-goal" class="btn btn-danger hidden">取消导航</button>
      <label class="row"><input type="checkbox" id="patrol-loop"> 循环巡逻</label>
      <button id="btn-patrol" class="btn">🔁 巡逻全部导航点</button>
      <button id="btn-stop-patrol" class="btn btn-danger hidden">停止巡逻</button>
    </div>

    <div class="panel-section" id="sec-waypoints">
      <h3>🚩 导航点</h3>
      <div id="waypoint-list"><em>暂无导航点，点左侧「加点」在地图上添加</em></div>
    </div>

    <div class="panel-section" id="sec-sensors">
      <h3>📊 传感器 / 状态</h3>
      <table id="sensor-table">
        <tr><td>位姿</td><td id="sv-pose">--</td></tr>
        <tr><td>速度</td><td id="sv-vel">--</td></tr>
        <tr><td>IMU 姿态</td><td id="sv-imu">--</td></tr>
        <tr><td>激光帧率</td><td id="sv-scan">--</td></tr>
        <tr><td>CPU</td><td id="sv-cpu">--</td></tr>
        <tr><td>内存</td><td id="sv-mem">--</td></tr>
        <tr><td>温度</td><td id="sv-temp">--</td></tr>
        <tr><td>磁盘</td><td id="sv-disk">--</td></tr>
      </table>
      <details><summary>节点存活</summary><div id="node-list">--</div></details>
    </div>

    <div class="panel-section" id="sec-log">
      <h3>📜 消息</h3>
      <div id="log-area"></div>
    </div>
  </div>
</div>

<script src="js/lib/roslib.min.js"></script>
<script src="js/ros.js"></script>
<script src="js/mapview.js"></script>
<script src="js/nav.js"></script>
<script src="js/waypoints.js"></script>
<script src="js/editor.js"></script>
<script src="js/teleop.js"></script>
<script src="js/panel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
