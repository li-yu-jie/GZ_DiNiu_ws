# =============================================================================
# nav2_params.yaml — 地牛叉车 Nav2 导航参数配置
#
# 车型：Tricycle 前驱转向三轮车（前轮驱动+转向，base_link 在后轴连线中点）
# 整车尺寸：长 1.85m（含货叉超 2.6m）× 宽 0.7m
#
# 关键调参记录（详见 lidar_navigation_guide.md 避坑指南）：
#   1. FollowPath 预瞄距离 0.6m→1.8m：消除低速前轮剧烈扭摆（抖动 ±30°→≤1.8°）
#   2. footprint 按整车实际轮廓设置，前边界 1.60m，须与 laserscan_filter 的 x_max 一致
#   3. 代价地图障碍源为 /scan_filtered（过滤车体自遮挡后的干净扫描）
#   4. Tricycle 不能原地自转：use_rotate_to_heading=false，allow_reversing=false
#   5. ★ 禁用 Spin 恢复行为（behavior_plugins 移除 spin + 自定义无 Spin 行为树）：
#      伪原地自转（前轮 90°+高速驱动）扫掠面积大、Spin 碰撞检测漏检，会撞墙持续转圈
#   6. ★ velocity_smoother 显式配置并与 RPP desired_linear_vel 对齐（均 0.6）：
#      缺省时默认 max_velocity.x=0.5 截断 0.8，w 不同比缩 → 转向等效 1.6× 增益画龙；
#      min_lookahead_dist 提至 1.3m（=轴距，纯追踪稳定下限），消除低速前轮左右猛打
# =============================================================================

# ---------- AMCL 定位（模式 B 使用；模式 A-2（use_relocalization:=true）也使用本段做地图匹配重定位） ----------
amcl:
  ros__parameters:
    use_sim_time: false
    # 运动模型噪声系数（α1~α5）：轮式里程计误差估计，越大粒子越发散
    # FAST-LIO 提供的 odom→base_link 精度较高，但保守起见保持中等噪声
    alpha1: 0.05                        # ★ 调小运动模型噪声方差：FAST-LIO 精度高，不让粒子团无故扩散
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: base_link
    beam_skip_distance: 0.3              # ★ 缩紧至 0.3m！行人在车前移动时，离墙>30cm 的人体点云瞬间被 AMCL 剔除，防止运动中定位偏斜
    beam_skip_error_threshold: 0.8
    beam_skip_threshold: 0.2             # ★ 剔除阈值设为 0.2，强力过滤行人在车前行走穿过时的动态干扰
    do_beamskip: true                    # ★ 开启动态人体/障碍物激光束剔除！自动忽略站在通道中央的人体
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field  # 似然场模型，室内结构化环境定位稳定
    max_beams: 120                       # 每次更新使用的激光束数由 60 提升至 120，显著增强稀疏特征环境下的定位精度                       # 每次更新使用的激光束数，越大越准但越耗 CPU
    max_particles: 5000                 # ★ 提高至 5000：更多粒子 → 更强特征稀疏环境下的定位稳定性
    min_particles: 1000                 # ★ 提高至 1000：保证最少粒子数，防止粒子匮乏导致漂移
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1            # ★ 开启快速粒子恢复：位置偏移后自动注入新粒子搜索正确位置
    recovery_alpha_slow: 0.001          # 开启慢速恢复：持续缓慢补充粒子，防止长时间漂移后无法自纠
    resample_interval: 1
    # ⚠️ 差速运动模型：Tricycle 无严格匹配的 AMCL 模型，用差速模型近似（转向角受限，够用）
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    set_initial_pose: false              # 不强制使用固定初始位姿；模式 A-2 首次需通过 RViz 2D Pose Estimate 给出粗位姿
    sigma_hit: 0.2                      # ★ 适度放宽至 0.2：兼顾匹配精度与粒子收敛速度，偏移后能更快找回正确位置
    update_min_d: 0.02                   # ★ 0.02m：高精平滑跟进位姿更新
    update_min_a: 0.02                   # ★ 0.02rad：高精旋转跟进更新
    # 观测模型权重：hit(命中)/short(意外近-人体)/max(超程)/rand(随机)
    z_hit: 0.85                          # ★ 主权重 0.85，强力锁定墙壁与真实地图特征
    z_max: 0.05
    z_rand: 0.05                        # 标准随机观测容差
    z_short: 0.05                        # 障碍物容差
    scan_topic: scan_filtered
    # 每 0.5 秒定期对齐 map->odom 坐标，锁定墙壁激光点云，彻底消除静止姿态漂移
    time_to_update_particle_filter: 0.5

# ---------- 行为树导航器：统筹 规划→控制→恢复 的完整导航任务流 ----------
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 100
    # ★ action server 应答超时（毫秒）：默认 20ms 在高负载下必然超时，
    #    目标会被直接 abort（compute_path_to_pose 无应答），放宽至 1000ms
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
    # ★ 自定义行为树（launch 中通过 RewrittenYaml 注入绝对路径）：
    # 已移除 Spin 90° 恢复动作 —— Tricycle 无法真正原地自转，底盘“前轮 90°+高速驱动”
    # 的近似旋转扫掠面积大，Spin 碰撞检测按纯旋转仿真会漏检，导致扫墙/撞墙持续转圈
    default_nav_to_pose_bt_xml: "navigate_to_pose_w_replanning_and_recovery_no_spin.xml"
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery_no_spin.xml"
    # ⚠️ through_poses 树也必须是无 Spin 版，否则 bt_navigator 激活时加载默认树
    # 会因 spin action server 不存在而失败，整车导航目标全部被拒
    default_nav_through_poses_bt_xml: "navigate_through_poses_w_replanning_and_recovery_no_spin.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

# ---------- 控制器服务器：跟踪全局路径，输出 /cmd_vel ----------
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0          # 控制频率设置为 10Hz（严格匹配 FAST-LIO 10Hz 雷达更新，消除 50ms 阶跃旧位姿）
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5       # 横向速度阈值（Tricycle 无横向运动能力，此项不生效）
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 进展检查：5 秒内必须移动超过 0.1m，否则判定卡死触发恢复行为
    # （叉车重载启动惯量大、局部重规划期间可能短暂原地等待，5.0s 给足裕量防止误判卡死频繁触发 BackUp）
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 5.0
    # 到点判定：位置误差 ≤0.25m 且航向误差 ≤0.25rad 视为到达
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # ========== RPP 纯追踪控制器（核心调参区） ==========
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6           # ★ 与 velocity_smoother max_velocity.x 严格对齐！此前 0.8 被 smoother 默认 0.5 静默截断，w 不按比例缩 → alpha=atan(wL/v) 等效 1.6× 转向增益，画龙摆动的根因
      lookahead_dist: 1.8
      min_lookahead_dist: 1.3          # ★ 提至 1.3m = 物理轴距！纯追踪预瞄 < 轴距即欠稳定（低速/过弯 0.25m/s 时钳在此值）；1.3m 仍可跟踪 1.3m 最小转弯半径
      max_lookahead_dist: 3.0          # ★ 最大预瞄距离
      lookahead_time: 2.5              # 2.5s: 巡航 0.6m/s → lookahead=1.5m（稳定区）；弯道 0.25m/s → 0.625m 钳到 1.3m min
      rotate_to_heading_angular_vel: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05        # 接近目标时的最小爬行速度
      approach_velocity_scaling_dist: 1.0       # 距目标 1.0m 内开始减速
      # 碰撞检测：减少前瞻预测时间，防止长车身在直角弯拐弯时把侧面墙壁投影误判为碰撞
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.2 # ★ 降至 0.2s！过弯时车身转动导致 footprint 投影短暂掠过角落墙壁，0.6s 会持续虚报触发急停；0.2s 只检测车头正前方 5cm 内的真实硬障碍，彻底消除转弯虚警卡死
      # 规则化速度缩放：结合大预瞄与拐大向，弯道保持 0.25m/s 高速顺畅过弯
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_speed: 0.25   # ★ 弯道过弯速度提升至 0.25m/s (25cm/s)
      regulated_linear_scaling_min_radius: 1.5   # ★ 增大至 1.5m！因为叉车转弯半径规划为 1.3m。当探测到转弯半径 < 1.5m 时强制小车平稳降速至 0.25m/s（降速后预瞄收缩至 0.6m，从而能打满舵急转弯，防止冲出跑道撞外墙！）
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.8             # ★ 扩大探测距离至 0.8m，提早感知内墙壁的存在
      cost_scaling_gain: 10.0
      inflation_cost_scaling_factor: 3.5         # 注意：此项只在靠近高代价区时降低线速度（不控制方向！RPP 纯追踪永远只追预瞄点，无侧向避障能力）。贴墙时自动降速，配合全局 V 谷居中路径实现切外弯
      use_rotate_to_heading: false  # 禁用 RPP 原地自转对齐。防止长车身货叉在转弯时原地旋转扫墙导致避障卡死
      allow_reversing: false        # 禁止倒车（后向无雷达视野，安全风险）

# ---------- 局部代价地图：静态地图 + 实时雷达避障（滚动窗口跟随车体） ----------
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0            # ★ 提升至 10.0Hz (100ms)，车行驶中有人突然走过切入前方，0.1 秒内瞬间感知识别并急停
      publish_frequency: 5.0
      global_frame: odom                # 局部地图挂在 odom 系，避免定位抖动影响避障
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.5
      rolling_window: true              # 5m×5m 滚动窗口，始终覆盖车体周边
      width: 5
      height: 5
      resolution: 0.05                  # 5cm 栅格分辨率
      robot_radius: 0.95  # 后备防撞圆半径（footprint 解析失败时的兜底）
      # ★ 整车物理碰撞轮廓：前边界 1.60m（前轮向前 30cm）/ 后边界 -0.30m（后轮向后 30cm）/ 半宽 0.35m / 总车长 1.90m
      footprint: "[[1.60, 0.35], [1.60, -0.35], [-0.30, -0.35], [-0.30, 0.35]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered         # ★ 使用过滤自遮挡后的扫描，勿改回 /scan
          max_obstacle_height: 2.0
          clearing: true                # 允许射线穿透清除过期障碍
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0       # 超过 8m 的障碍不标记（远端不可靠）
          obstacle_min_range: 0.0
          inf_is_valid: true            # ★ 允许 +inf 射线穿透清除离开的动态/虚假障碍物！
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0          # ★ 指数极速衰减，确保通道中央为零代价，最大化物理可通过空间
        inflation_radius: 0.38          # ★ 局部定位与防撞安全阈值设为 0.38m，提供 3cm 缓冲，彻底杜绝起点碰撞与刮擦！
      always_send_full_costmap: false     # ★ 设为 false！只发布局部代价地图的增量更新（Diff），降低带宽占用，彻底根治 RViz 延迟卡顿！

# ---------- 全局代价地图：静态地图 + 实时障碍，供全局规划 ----------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0             # 提升至 5.0Hz (0.2s)，人走后 0.2 秒内立刻清除全局地图人体障碍
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 0.5
      robot_radius: 0.95
      footprint: "[[1.60, 0.35], [1.60, -0.35], [-0.30, -0.35], [-0.30, 0.35]]"  # 物理实际车身尺寸
      # ★ keepout_filter 必须放在 inflation_layer 之前：禁区同样会被膨胀层外扩，彻底禁行
      plugins: ["static_layer", "obstacle_layer", "keepout_filter", "inflation_layer"]
      # ---------- Web 端禁区层（Keepout Filter）：由 filter_mask_server 发布 /keepout_filter_mask ----------
      # mask 语义：黑色(占用)=禁区，白色(空闲)=正常通行；网页修图页绘制后热加载生效
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true   # 确保能收到 map_server 的 latched 地图
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered         # 同局部地图，使用过滤后的扫描
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          inf_is_valid: true            # ★ 允许 +inf 射线穿透清除鬼影障碍物
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5          # ★ 折中 2.5：1.5 衰减过缓，窄走廊两侧墙包的代价场延伸到中线，规划器沿途躲包导致路径蛇形；2.5 保住开阔区推离墙壁的效果，又让走廊小包的代价到不了中线
        inflation_radius: 0.75          # 0.75m：维持原值，不压缩可通行宽度
      always_send_full_costmap: false     # ★ 设为 false！只发布全局代价地图的增量更新（Diff），降低带宽占用，彻底根治 RViz 延迟卡顿！

# ---------- 地图服务器：加载 2D 栅格地图（yaml 路径由 launch 参数传入） ----------
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

# ---------- 禁区过滤器信息服务：向 global_costmap 的 keepout_filter 通告 mask 话题与换算系数 ----------
# type: 0 = 禁区(Keepout)；filter_value = base + multiplier × mask占用值，黑色占用格(100) → 禁区
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

# ---------- 全局规划器：基于静态+实时代价地图搜索全局路径 ----------
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid" # ★ 工业叉车 Hybrid-A* 运动学规划器
      downsample_costmap: true         # ★ 开启代价地图降采样（加速长距离路径搜索）
      downsampling_factor: 2           # ★ 降采样因子设为 2（从 5cm 降为 10cm 规划网格，大幅提升狭窄通道规划连通性，防止误判堵塞）
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 2000000
      max_on_approach_iterations: 10000 # 增大逼近迭代上限
      max_planning_time: 5.0           # 最大容许规划时间放宽至 5.0s，防止超时退出
      analytic_expansion_ratio: 5.0    # 增大解析膨胀比例，加速末端 Reeds-Shepp 曲线收敛
      analytic_expansion_max_length: 25.0 # ★ 增大最大解析长度至 25.0m，长距离直接解析连接，免去冗余搜索
      reverse_penalty: 2.1
      change_penalty: 3.5              # ★ 提高至 3.5：严厉惩罚打角方向切换，彻底消灭全局规划在直道上的 S 形波浪折线！
      non_straight_penalty: 2.2        # ★ 提高至 2.2：重罚转向段，规划器偏好"先摆正车身再直穿门/直行道"，杜绝斜角进门导致叉尖扫门框的几何死局
      cost_penalty: 2.5                # ★ 折中 2.5：3.5 时窄走廊里逐个躲避墙包代价场导致路径蛇形、方向盘左右打；2.5 保留"开阔区绕外不抄近道"的效果，又不对微小代价噪点过度反应
      minimum_turning_radius: 1.3        # 地牛叉车物理最小转弯半径 1.3m
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      smoother:
        max_iterations: 2000
        w_smooth: 0.5                  # ★ 折中 0.5：0.4 时 A* 残留的微小蛇形原样下发，RPP 预瞄点左右跳导致打方向；0.5 熨平走廊微弯，又不至于像 0.6 那样在拐角硬拉直线切内侧
        w_data: 0.15                   # 折中数据吸引力
        tolerance: 1e-10

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5    # ★ 与其他节点统一为 0.5s；FAST-LIO 10Hz（帧间隔 100ms），0.1s 近零余量，CPU 稍忙即触发 TF 查询失败中止恢复行为
    use_sim_time: false
    simulate_ahead_time: 2.0

# ---------- 速度平滑器：cmd_vel_nav → cmd_vel（消阶跃 + 消除 w/v 不匹配） ----------
# ★ 关键：缺省配置时 Humble 默认 max_velocity.x=0.5，会把 RPP 的 0.8 静默截断，
#    而 angular.z 不按比例缩放 → 底盘 alpha=atan(wL/v) 等效 1.6× 转向增益，直道画龙；
#    低速段 v 小 w 大，前轮频繁打满 ±75° 并随 w 符号翻转 = 左右猛打方向。
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 1.0]      # ★ x 上限与 RPP desired_linear_vel 严格对齐（0.6）
    min_velocity: [-0.6, 0.0, -1.0]    # 保留负向：BackUp 恢复行为需要倒车
    max_accel: [0.5, 0.0, 2.0]         # ★ 限制线/角加速度：抹平启动阶跃与 AMCL 0.5s 位姿跳变带来的 w 抖动
    max_decel: [-1.0, 0.0, -2.5]
    odom_topic: "odom"
    velocity_timeout: 1.0
