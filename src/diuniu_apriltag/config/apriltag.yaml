# AprilTag 检测器参数（apriltag_ros 节点）
# 节点名固定为 apriltag，此文件由 launch/apriltag.launch.py 加载
apriltag:
  ros__parameters:
    # 图像传输方式：raw（不经压缩，本机进程间传输）
    image_transport: raw

    # 标签家族：现场使用的码为 36h11（6x6 数据位 + 黑边框）
    family: 36h11

    # 默认标签边长 (m) —— 指黑色方块外缘边长，不含白色留白边
    # 2026-08-26 换用 18cm 大码（1080p 下 3m 处仍有 ~100px 边长，远距离识别用）。
    # 历史：9.41cm 码（2026-08-22 三点卷尺现场标定值，80mm 系误测的修正）。
    size: 0.18

    # 允许的最大汉明误码位数：0 = 只接受完全无误码的检测（最严格，误检最少）
    max_hamming: 0

    detector:
      # 检测线程数（16 核机器，给足 4 线程压低单帧耗时）
      threads: 4
      # 图像降采样因子：2.0 = 半分辨率做四边形初检（检测成本降至 1/4），
      # refine=true 会在原分辨率上细化角点，位姿精度几乎不受影响。
      # 1080p 下这是流畅度的关键（2026-08-22 卡顿治理）。
      decimate: 2.0
      # 高斯模糊 sigma：0.0 = 不模糊（去噪与角点锐度的权衡）
      blur: 0.0
      # 边缘细化：提高角点定位精度（decimate=2 时必须开，保住亚像素精度）
      refine: true
      # 图像锐化强度（解码前对图像做 unsharp mask）；0 = 关闭，省一次全图卷积
      sharpening: 0.0
      # debug 模式：保存中间图像到 ~/.ros（调试用，平时关闭）
      debug: false

    # —— 特定标签的 TF 配置 ——
    # apriltag_ros 只为这里显式配置的标签发布 TF（不配置则 /tf 为空）。
    # ids/frames/sizes 三个列表按位置一一对应。
    # 现场标签：36h11 家族，ID = 0，黑色外缘 18cm（2026-08-26）。
    # 注意：18cm 为用户报称值，换码后建议做一次卷尺单点复验
    # （放 1m 处看读出是否 ~1.01m，偏差大则按 tag.sizes /= 比例k 修正）。
    tag:
      ids: [0]
      frames: [tag0]
      sizes: [0.18]
