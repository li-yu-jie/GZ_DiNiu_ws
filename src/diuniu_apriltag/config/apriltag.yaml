# AprilTag 检测器参数（apriltag_ros 节点）
# 节点名固定为 apriltag，此文件由 launch/apriltag.launch.py 加载
apriltag:
  ros__parameters:
    # 图像传输方式：raw（不经压缩，本机进程间传输）
    image_transport: raw

    # 标签家族：现场使用的码为 36h11（6x6 数据位 + 黑边框）
    family: 36h11

    # 默认标签边长 (m) —— 指黑色方块外缘边长，不含白色留白边
    # 2026-08-18 用户实测：黑色方块外缘正好 80mm
    # 2026-08-22 现场标定修正：卷尺三点 (20/50/70cm) 拟合 z_read = 0.850*z_true，
    # 反推有效边长 = 0.08/0.850 = 94.1mm（黑色外缘很可能实为 ~94mm，80mm 系误测）。
    # 距离以本值为准，与卷尺真值的偏差全程 < 2mm + 恒定 ~1cm（光学中心在卷尺零点后）。
    size: 0.0941

    # 允许的最大汉明误码位数：0 = 只接受完全无误码的检测（最严格，误检最少）
    max_hamming: 0

    detector:
      # 检测线程数
      threads: 2
      # 图像降采样因子：1.0 = 不降采样（640x480 小图，保精度优先）
      decimate: 1.0
      # 高斯模糊 sigma：0.0 = 不模糊（去噪与角点锐度的权衡）
      blur: 0.0
      # 边缘细化：提高角点定位精度
      refine: true
      # 图像锐化强度（解码前对图像做 unsharp mask）
      sharpening: 0.25
      # debug 模式：保存中间图像到 ~/.ros（调试用，平时关闭）
      debug: false

    # —— 特定标签的 TF 配置 ——
    # apriltag_ros 只为这里显式配置的标签发布 TF（不配置则 /tf 为空）。
    # ids/frames/sizes 三个列表按位置一一对应。
    # 现场标签：36h11 家族，ID = 0。
    # 边长 94.1mm 来源见上方 size 注释（2026-08-22 三点卷尺现场标定）。
    tag:
      ids: [0]
      frames: [tag0]
      sizes: [0.0941]
