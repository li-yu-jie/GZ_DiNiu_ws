# 倒车对中控制器参数（tag_align 节点）
# 由 launch/apriltag.launch.py 在 align:=true 时加载；改完需重启 launch 生效
tag_align:
  ros__parameters:
    # —— 坐标系 ——
    camera_frame: camera_optical_frame
    tag_frame: tag0

    # —— 运动设定 ——
    # 倒车线速度上限 (m/s)，linear.x 为负。距离控制开启时这是远段恒速值，
    # 接近段按 k_v 比例减速、min_creep 爬行到 target_z 停车（见下）。
    # 注意三轮车打角 alpha=atan(w·L/v)：v 越小同样的 w 打角越大
    reverse_speed: 0.16
    max_angular: 0.4          # 角速度限幅 (rad/s)

    # —— 角度控制增益 ——
    # 横向角 θ = atan2(码中心 x, z)：码偏出画面中心的角度，倒车时把车调正
    k_lat: 1.2                # rad/s per rad (由0.3调高至1.2，增强横向纠偏响应速度)
    # 偏航角：与 distance_watch.py 同一定义（四元数 ZYX 绕相机 z 轴）。
    # ★ 俯视地面码的几何使读数基线在 +90° 附近而非 0°——
    #   yaw_target_deg = 车与码摆正时的实读数（2026-08-31 用户实车目视摆正复测：+90°；
    #   该基线在漂移：8-26 内参修正后 +90° → 8-30 复测 +100° → 8-31 又回到 +90°，
    #   证实相机安装座松动会被碰转，每次动相机必须重标此值，并尽快机械锁紧）
    k_yaw: 0.15               # (由0.5调低至0.15，减缓延迟带来的振荡)
    yaw_target_deg: 90.0

    # —— 方向符号 ——
    # 2026-08-30 实车复测最终标定（与 8-26 记录一致）：
    #   steer_sign: 横向对中符号 = -1.0（车朝码收拢；+1 为 8-30 试调反方向，已推翻）。
    #   yaw_sign: 偏航自转符号 = -1.0（ALIGN3 原地自转朝 yaw_target 收敛；
    #   8-30 曾误改为 +1，实测 +1 自转方向为反，当日改回 -1）。
    #   将两者分离以解决由于相机安装/底盘接线导致的横向与偏航控制符号冲突问题。
    steer_sign: -1.0
    yaw_sign: -1.0

    # —— 距离控制（到位停车，两段式状态机）——
    # drive 倒车调距离（纯横向对中，屏蔽偏航项）
    #   → align3 原地自转精调偏航（v=0，底盘纯旋转模式前轮±90°绕后轴自转）
    #   → done 停车锁定（过冲 → overshoot 只停不补，拉回远处自动重对）
    # （历史 align1 倒车前预旋转段已删除：drive 横向对中本身会把偏航带进
    #   align3 可精调范围，预旋转只会浪费时间+放大误差）
    distance_enable: true     # false = 只调角度、恒速倒车不管距离（旧行为）
    # ★ target_x 补偿相机安装偏心或偏航倾角导致的左右物理横向偏差。
    #   快捷标定：ros2 param set /tag_align target_x <左右x实读数> 立即生效先试，
    #   满意后写回此文件固化。
    target_x: 0.0             # 目标 x 实读数 (m)，即横向对中补偿值
    # ★ target_z 必须现场标定：人工把车停到真实到位点，
    #   看节点日志（或 distance_watch）的 z 读数填入。
    #   快捷标定：ros2 param set /tag_align target_z <读数> 立即生效先试，
    #   满意后写回此文件固化（param set 重启即丢；节点每周期热读参数）。
    #   码要贴在到位时仍在相机视野内的位置！
    target_z: 2.30            # 到位时 z 实读数 (m)（2026-08-26 用户指定停距 2.30m）
    k_v: 0.4                  # 接近段速度斜率：v = k_v·(z−target_z)，上限 reverse_speed
    min_creep: 0.12           # 末段爬行速度 (m/s)，修改为 0.12 以克服电机启动死区/摩擦力
    creep_floor: 0.06         # 横向减速后的速度下限 (m/s)：v_scale 大横向偏差减速可低于
                              # min_creep，但不低于此值；★必须 >0.05（底盘纯旋转触发阈值），
                              # 否则 |v|<0.05 且 |w|≥0.05 车会进入原地自转模式变成打转
    arrive_tol: 0.03          # 到位死区 (m)：|z−target_z| 小于此值即转精调偏航
    rearm_extra: 0.30         # 到位后被拖离/推近超过该距离 (m) 自动重新武装
    yaw_tol_deg: 3.0          # 偏航收敛容差 (度)：align3 的出口判据
    settle_time: 5.0          # 到中对正后稳定保持时间门限 (s)：连续满足对齐才判完成，防抖动
    min_pivot_w: 0.10         # 原地自转最小角速度 (rad/s)：低于底盘 0.05 触发阈值
                              # 只打角不走车会假死，收敛末端把小 w 抬到该值
    stale_w_window: 0.8       # align3 只用该时长内的新检测发自转 w (s)，
                              # 其余周期发零速等新帧（由 0.3 调高至 0.8，消除丢帧卡顿）
    freeze_timeout: 3.0       # 内容冻结判活 (s)：stamp 在推进但位姿读数不变
                              # （相机冻结/USB 卡死或车轮受阻打滑）→ 停车
    # 过冲（z < target_z）：只停车报警，不自动前开补距离；拉回远处自动重新对中

    # —— 安全 ——
    lost_timeout: 1.5         # 无新检测超过该时长视为丢码 → 立即停车 (s)。
                              # 检测链 CPU 争抢时帧率可掉到 1~2fps，0.5s 会误杀活码；
                              # 1.5s×0.16m/s = 24cm 盲倒上限可接受
    control_rate: 20.0        # cmd_vel 发布频率 (Hz)，底盘看门狗 0.2s 需 >5Hz
    enabled: true             # false = 持续零速暂停；ros2 param set 可热切换

    # —— 拉前重试修正参数 ——
    max_forward_retries: 5    # 到位但横向未对齐时，向前滑行重新纠偏的最大尝试次数
    forward_adjust_dist: 0.25 # ★前拉距离上限 (m)：实际前拉 ∝ 横向偏差（约 3×|x 误差|，下限 0.08m），
                              #  封顶此值——不再每次固定走 25cm。前调只直行不打舵（8-30 实车证伪：
                              #  打舵在相机系方位角反馈下正反馈，w 顶死 0.40 满舵假死+甩丢码）
    lateral_align_tol: 0.03   # 横向对准判别容差 (m)，大于该偏差将触发向前滑行重试
    k_x: 0.5                  # ★横向"米制"增益 (rad/s per m，2026-08-30 新增)：DRIVE 横向控制律
                              #  w=steer_sign·(k_lat·θ_lat + k_x·x误差)。θ_lat=atan2(x,z) 远距角度小、
                              #  纠偏弱；米制项让 26cm 级大横向偏差获得与距离无关的强纠偏，收敛显著加快。
                              #  振荡就往小调（0.3），纠偏还慢就往大调（0.8）
