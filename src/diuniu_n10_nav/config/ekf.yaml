# =============================================================================
# 本文件复制自 diuniu_nav/config/ekf.yaml（2026-08-31 N10 栈建立）。
# N10 栈中 EKF 是唯一的 odom→base_link 源（无 FAST-LIO），必须启动。
# 修改请与 diuniu_nav/config/ekf.yaml 双向同步。
# =============================================================================
# ekf.yaml — 地牛叉车多源传感器融合配置 (robot_localization EKF)
#
# 融合传感器源：
#   1. 轮式里程计 (/wheel_odom): 提供高频线速度 vx 和角速度 wz (静止时 0 噪声)
#   2. 底盘 BNO085 IMU (/imu/data): 提供绝对航向 yaw (唯一航向源)
#   ⚠️ FAST-LIO /odom 不送进 EKF：它的 x,y 在 FAST-LIO 自己的 odom 系
#      (航向以 Mid360 IMU 上电朝向为 0)，与 EKF 锚定 BNO085 航向的 odom 系
#      存在常值旋转，融合会导致预测/观测互拉、位姿跳变"乱跑"(2026-08-24 实车事故)。
#      FAST-LIO 仅用于把 3D 点云切成 /scan；绝对位姿由 AMCL 地图匹配提供。
# =============================================================================
ekf_filter_node:
  ros__parameters:
    frequency: 30.0                     # EKF 滤波融合输出频率 30Hz
    sensor_timeout: 0.5
    two_d_mode: true                    # 工业叉车平面二维运动模式 (z=0, roll=0, pitch=0)
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    # 坐标系定义
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom                   # 发布 odom -> base_link TF

    publish_tf: true                    # 由 EKF 统一发布融合后的 odom -> base_link TF

    # ── 传感器 1: 底盘轮式里程计 (/wheel_odom) ────────────────────────────────
    # 只融合线速度 vx 和角速度 wz，发挥其静止时 100% 零漂移的优势
    odom0: /wheel_odom
    odom0_config: [false, false, false,   # x, y, z
                   false, false, false,   # roll, pitch, yaw
                   true,  false, false,   # vx, vy, vz
                   false, false, true,    # vroll, vpitch, vyaw (★ 2026-08-31 恢复为 true：必须融合轮式里程计的角速度！静止时轮子输出极其稳定的 wz=0，能像锚一样死死拉住 IMU，防止静止飘移！)
                   false, false, false]   # ax, ay, az
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # ── (已移除) FAST-LIO /odom ─────────────────────────────────────────────
    # 勿把 FAST-LIO 的 x,y 或 yaw 加回 EKF：坐标系与 BNO085 锚定的 odom 系不一致，
    # 会引起位姿互拉扯导致车在地图上乱跑。详见文件头注释。

    # ── 传感器 3: 底盘 BNO085 / IMU (/imu/data, frame: base_imu_link) ─────────────
    # ★ 融合绝对航向 yaw（BNO085 融合四元数），作为整车唯一绝对航向源；
    #    与 map 系的常值偏差由 AMCL 的 map→odom 变换自动吸收
    # ⚠️ 勿开 vyaw：单片机帧内无陀螺仪原始数据，angular_velocity 恒为 0，
    #    融合它会错误地把航向角速度钉死在 0，与轮式里程计/FAST-LIO 对抗
    imu0: /imu/data   # 2026-08-28 起底盘只在 /imu/data 发 BNO085（/imu2/data 双发已摘除）
    imu0_config: [false, false, false,
                  false, false, true,     # yaw ← BNO085 绝对航向
                  false, false, false,
                  false, false, false,    # vyaw ← 无数据，必须关闭
                  false, false, false]
    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
